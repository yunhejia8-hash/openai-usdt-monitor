name: Update OPENAIUSDT market snapshot

on:
  schedule:
    # GitHub scheduled workflows can occasionally be delayed or skipped.
    # Keep the primary hourly run at :17 and add a :47 fallback so the
    # snapshot is normally no more than ~30 minutes stale.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "monitor.py"
      - "test_monitor.py"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: openai-usdt-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate strategy
        run: |
          python -m unittest -v
          python -m py_compile monitor.py test_monitor.py

      - name: Fetch OKX market data
        env:
          HAS_POSITION: ${{ vars.HAS_POSITION || 'false' }}
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if python monitor.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "monitor.py failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 20 seconds..."
            sleep 20
          done

      - name: Commit snapshot
        run: |
          git config user.name "openai-usdt-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add output/latest.json output/index.html
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "Update market snapshot"
            git push
          fi
