name: Update OPENAIUSDT market snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "monitor.py"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch OKX market data
        run: python monitor.py

      - name: Commit snapshot
        run: |
          git config user.name "openai-usdt-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add output/latest.json output/index.html
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "Update market snapshot"
            git push
          fi
