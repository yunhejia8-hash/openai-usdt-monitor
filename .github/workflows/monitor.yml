name: Update OPENAIUSDT market snapshot

on:
  schedule:
    # GitHub scheduled workflows are best-effort and can be delayed/dropped.
    # Ask the scheduler every 15 minutes to reduce the chance of a long gap;
    # the freshness gate below keeps actual snapshots near the 30-minute target.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Caller identity for health telemetry"
        required: false
        default: "manual"
        type: string
  push:
    paths:
      - "monitor.py"
      - "test_monitor.py"
      - "requirements.txt"
      - "workflow_health.py"
      - "test_health_watchdog.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: openai-usdt-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check snapshot freshness
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("output/latest.json")
          if not p.exists():
              print("SNAPSHOT_HEALTH=missing")
              raise SystemExit(0)
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
              ts = d.get("generated_at_utc")
              if not ts:
                  print("SNAPSHOT_HEALTH=missing_timestamp")
                  raise SystemExit(0)
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(ts.replace("Z","+00:00"))).total_seconds()/60
              print(f"PREVIOUS_SNAPSHOT_AGE_MINUTES={age:.1f}")
              print("SNAPSHOT_HEALTH=stale" if age > 60 else "SNAPSHOT_HEALTH=fresh")
              # Scheduled runs are redundant probes. Skip expensive work when
              # the last snapshot is still younger than 25 minutes.
              skip = os.environ.get("GITHUB_EVENT_NAME") == "schedule" and age < 25
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"skip={'true' if skip else 'false'}\n")
                  out.write(f"previous_age_minutes={age:.3f}\n")
                  out.write(f"previous_health={'stale' if age > 60 else 'fresh'}\n")
          except Exception as e:
              print(f"SNAPSHOT_HEALTH=invalid ({e})")
          PY

      - name: Set up Python
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Validate strategy and reliability code
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python -m unittest -v
          python -m py_compile monitor.py workflow_health.py watchdog.py test_monitor.py test_health_watchdog.py

      - name: Fetch OKX market data
        if: steps.freshness.outputs.skip != 'true'
        env:
          HAS_POSITION: ${{ vars.HAS_POSITION || 'false' }}
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if python monitor.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "monitor.py failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 20 seconds..."
            sleep 20
          done

      - name: Write workflow health
        if: steps.freshness.outcome == 'success' && (steps.freshness.outputs.skip == 'true' || success())
        shell: bash
        env:
          RUN_EVENT: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.sha }}
          PREVIOUS_AGE_MINUTES: ${{ steps.freshness.outputs.previous_age_minutes }}
        run: python workflow_health.py

      - name: Commit snapshot and health telemetry
        if: steps.freshness.outcome == 'success' && (steps.freshness.outputs.skip == 'true' || success())
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openai-usdt-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add output/latest.json output/index.html output/signal_history.jsonl output/performance.json output/workflow_health.json
          if [ -f output/signal_evaluations.jsonl ]; then
            git add output/signal_evaluations.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi

          git commit -m "Update market snapshot"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Snapshot push succeeded on attempt $attempt."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Snapshot push failed after 3 attempts."
              exit 1
            fi

            echo "::warning::Push attempt $attempt failed; refreshing origin/main before retry."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict while recovering from concurrent main update."
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 5))
          done

# Reliability design:
# - monitor.yml owns market collection and strategy evaluation
# - 15-minute probes target an effective ~30-minute snapshot cadence
# - every observed schedule probe updates schedule-continuity telemetry, even when market refresh is skipped
# - watchdog.yml is a separate stale-data recovery path and dispatches this workflow only when needed
